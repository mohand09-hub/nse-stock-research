name: Deploy DABs Bundle

on:
  push:
    branches:
      - main  # Trigger on push to main branch
  pull_request:
    branches:
      - main  # Validate on PRs
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Check out the repository (Updated to v4)
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Set up Databricks CLI
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main
      
      # 3. Validate the bundle
      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate --strict --target dev
      
      # 4. Deploy the bundle (only on main branch, not PRs)
      - name: Deploy bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target dev
      
      # 5. Trigger the market open job after deployment safely
      - name: Trigger market open job (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        shell: bash
        run: |
          # 1. Capture full output (redirecting stderr to stdout to catch all text)
          SUMMARY_OUTPUT=$(databricks bundle summary --target dev 2>&1)
          
          # 2. Extract only valid JSON object/array lines to pass to jq
          JOB_ID=$(echo "$SUMMARY_OUTPUT" | grep -E '^\{|^\[' | jq -r '.resources.jobs[] | select(.name | contains("market_open")) | .id' 2>/dev/null || true)
          
          # 3. Validate the extraction to prevent blank/null API calls
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "❌ Error: Failed to extract Job ID from bundle summary."
            echo "=== Databricks Debug Output ==="
            echo "$SUMMARY_OUTPUT"
            exit 1
          fi
          
          echo "🚀 Found Job ID: $JOB_ID. Triggering run..."
          databricks jobs run-now --job-id "$JOB_ID"
