name: Deploy DABs Bundle

on:
  push:
    branches:
      - main  # Trigger on push to main branch
  pull_request:
    branches:
      - main  # Validate on PRs
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Check out the repository (Updated to modern v4)
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Set up Databricks CLI
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main
      
      # 3. Validate the bundle
      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate --strict --target dev
      
      # 4. Deploy the bundle (only on main branch, not PRs)
      - name: Deploy bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target dev
      
      # 5. Trigger the market open job after deployment safely using text parsing
      - name: Trigger market open job (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        shell: bash
        run: |
          # 1. Capture the human-readable summary text
          SUMMARY_OUTPUT=$(databricks bundle summary --target dev)
          
          # 2. Extract the numeric Job ID out of the URL string under nse_market_open
          JOB_ID=$(echo "$SUMMARY_OUTPUT" | grep -A 2 "nse_market_open:" | grep "URL:" | sed -E 's|.*/jobs/([0-9]+).*|\1|')
          
          # 3. Validate that a valid numeric ID was found
          if [ -z "$JOB_ID" ] || ! [[ "$JOB_ID" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: Failed to extract a valid numeric Job ID from bundle summary."
            echo "=== Databricks Debug Output ==="
            echo "$SUMMARY_OUTPUT"
            exit 1
          fi
          
          echo "🚀 Found Job ID: $JOB_ID. Triggering run..."
          databricks jobs run-now --job-id "$JOB_ID"
